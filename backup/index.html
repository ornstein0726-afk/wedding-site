<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SOYA & NATSUMI</title>



<link rel="stylesheet" href="style.css">

</head>



<body>



<div id="terminal">



    <div id="terminal-output"></div>



    <div id="input-container" class="hidden">



        <span>Enter invitation key:</span>



        <input

            type="password"

            id="passcode"

            maxlength="4"

            autocomplete="off">



        <button id="unlockBtn">

            ENTER

        </button>



    </div>



</div>



<div id="invitation-screen">



    <div class="center">



        <h1>ACCESS GRANTED</h1>



        <p>Invitation unlocked.</p>



        <span>Scroll to begin</span>



    </div>



</div>

<section id="opening">



    <div class="opening-inner">



        <h1 id="logo">

            Soya & Natsumi

        </h1>



        <img

            src="images/photo1.jpg"

            id="opening-photo">



        <div id="opening-text">



            <p>The wedding day.</p>



            <p>

                Finally,<br>

                we're getting married.

            </p>



            <p>At Hotel New Grand</p>



            <p>January 30, 2027</p>



        </div>



    </div>



</section>



<script src="app.js"></script>



</body>

</html>
